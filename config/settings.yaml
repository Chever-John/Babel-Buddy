models:
  llm:
    name: "minimax-m2.5-q6k"
    ollama_host: "http://localhost:11434"
    context_window: 20
  asr:
    model: "large-v3"
    device: "cpu"
  tts:
    host: "http://localhost:9880"
    voice_zh: "default_zh"
    voice_en: "default_en"

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 4096
  silence_timeout: 30

wake_word:
  engine: "porcupine"
  keyword: "hello_babel"

server:
  host: "0.0.0.0"
  port: 8000

storage:
  database: "data/sessions.db"
  audio_dir: "data/audio"
  audio_retention_days: 30
