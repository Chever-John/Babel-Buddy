[project]
name = "babel-buddy"
version = "0.1.0"
description = "Personal bilingual AI language buddy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "aiosqlite>=0.21.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[project.scripts]
babel-buddy = "babel_buddy.__main__:main"

[project.optional-dependencies]
speech = [
    "openai-whisper>=20240930",
    "silero-vad>=5.1",
    "pyaudio>=0.2.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
